[pytest]
# pytest 命令行默认参数：-v 详细输出、-s 打印标准输出、Allure 结果输出到 ./temps
addopts = -vs --alluredir=./temps --clean-alluredir

# 自定义标记
markers =
    login: 登录相关用例
    personal: 个人身份相关用例
    enterprise: 企业身份相关用例
    work_creation: 企业工作创作相关用例（政策解读/项目挖掘/立项/方案/交底/权利要求/说明书/相似专利）
    knowledge_base: 知识库相关用例（个人身份：进入/列表/上传/搜索/删除）

# 日志配置
log_file = ./logs/frame.log
log_file_level = info
log_file_format = %(levelname)s|%(asctime)s|%(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
