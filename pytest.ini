[pytest]
# pytest 命令行默认参数：-v 详细输出、-s 打印标准输出、Allure 结果输出到 ./temps
addopts = -vs --alluredir=./temps --clean-alluredir

# 关闭测试 id 的非 ASCII 转义，使中文 -k 过滤（如 -k "政策解读"）可正常匹配
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# 自定义标记
markers =
    login: 登录相关用例
    personal: 个人身份相关用例
    enterprise: 企业身份相关用例
    work_creation: 企业工作创作相关用例（职称申报4/专利工具4/人力资源6，三类14个功能）
    knowledge_base: 知识库相关用例（个人身份：进入/列表/上传/搜索/删除/收藏/图谱）

# 日志配置
log_file = ./logs/frame.log
log_file_level = info
log_file_format = %(levelname)s|%(asctime)s|%(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
