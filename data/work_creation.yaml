# 企业工作创作 —— 数据驱动用例数据
#
# 覆盖三类 14 个功能模块（入口 / 导航 / 必填校验 / 完整生成）：
#   职称申报：政策解读 / 项目方向挖掘 / 立项报告生成 / 项目方案生成
#   专利工具：技术交底书生成 / 权利要求书生成 / 专利说明书生成 / 查找相似专利
#   人力资源：工作经历生成 / 简历定向生成 / 简历优化 / 论文查重 / 材料审查 / 研究报告
#   （人力资源 6 工具的 URL/表单结构已于真站实测，见 README 关键实现说明）
#
# 字段说明：
#   url_keyword   —— 功能路由关键字（用于导航断言 + 详情页判断）
#   submit_button —— 提交按钮文案；无提交按钮（如选文件即触发）留空
#   title_mark    —— 页面特征文案；缺省用功能名。个别页面不展示功能名本身
#                     （工作经历生成→个人信息 / 简历优化→模块导航 / 论文查重→论文优化工作台）
#   no_submit_validation —— true 表示该功能无"空表单提交"按钮（编辑器/资料页），必填校验用例跳过
#   result_hint   —— 生成结果中应出现的内容关键字（用于断言生成成功）
#   fill          —— 表单填写配置（键对应 WorkFeaturePage.fill_form 的填写动作）
#   skip_reason   —— 完整生成会消耗职策点 / 结果未验证时填此字段，生成用例自动 skip

# 工作创作页应展示的全部功能入口
feature_names:
  - 政策解读
  - 项目方向挖掘
  - 立项报告生成
  - 项目方案生成
  - 技术交底书生成
  - 权利要求书生成
  - 专利说明书生成
  - 查找相似专利
  - 工作经历生成
  - 简历定向生成
  - 简历优化
  - 论文查重
  - 材料审查
  - 研究报告

# 各功能详情
features:
  - name: "政策解读"
    url_keyword: "policyElucidation"
    submit_button: "解读"
    no_submit_on_generate: true
    result_hint: "一句话解读"
    skip_reason: "已验证通过，避免重复消耗职策点；需验证生成流程时移除本标记"
    fill:
      policy_file: true

  - name: "项目方向挖掘"
    url_keyword: "projectDirectionMining"
    submit_button: "项目挖掘"
    result_hint: "文件抽取解析结果"
    skip_reason: "已验证可生成（仅需导入知识库文件，其余字段用持久化草稿值）；避免重复消耗职策点，需验证时移除本标记"
    fill:
      import_kb_file: true

  - name: "立项报告生成"
    url_keyword: "projectReportGeneration"
    submit_button: "下一步"
    result_hint: "内容由AI生成"
    skip_reason: "多步向导（基本信息→项目概述→项目立项），已支持两步填写；待职策点充足后验证，需验证时移除本标记"
    fill:
      project_name: "面向超高清显控终端的嵌入式驱动软件平台研发"
      start_date: "2024-01-01"
      end_date: "2025-12-31"
      amount: "100"
      unit: "浙江深佳科技有限公司"
      import_kb_file: true
      step2:
        template: "标准型"
        budget: "100"

  - name: "项目方案生成"
    url_keyword: "projectProposalGeneration"
    submit_button: "下一步"
    result_hint: "内容由AI生成"
    skip_reason: "已修复（需参考文件+基本信息）；待职策点充足后验证，需验证时移除本标记"
    fill:
      project_name: "面向超高清显控终端的嵌入式驱动软件平台研发"
      start_date: "2024-01-01"
      end_date: "2025-12-31"
      amount: "100"
      people: "10"
      description: "研发一套面向超高清显控终端的嵌入式驱动软件平台，实现多路视频信号的采集、处理与显示控制。"
      import_kb_file: true

  - name: "技术交底书生成"
    url_keyword: "technical"
    submit_button: "下一步"
    result_hint: "核心技术创新点"
    skip_reason: "已验证通过，避免重复消耗职策点；需验证生成流程时移除本标记"
    fill:
      description: "一种基于物联网的智能恒温控制系统，通过温度传感器实时采集环境温度，结合模糊控制算法动态调节加热功率，实现±0.5℃的控温精度。应用领域：智能家居温控、工业恒温设备。关键指标：控温精度±0.5℃、响应时间<1s。"

  - name: "权利要求书生成"
    url_keyword: "claims"
    submit_button: "生成权利要求书"
    result_hint: "本步已完成"
    skip_reason: "已验证通过，避免重复消耗职策点；需验证生成流程时移除本标记"
    fill:
      description: "一种基于物联网的智能恒温控制系统，通过温度传感器实时采集环境温度，结合模糊控制算法动态调节加热功率，实现±0.5℃的控温精度。应用领域：智能家居温控。关键指标：控温精度±0.5℃、响应时间<1s。"

  - name: "专利说明书生成"
    url_keyword: "patent"
    submit_button: "生成专利说明书"
    result_hint: "背景技术"
    skip_reason: "已验证通过，避免重复消耗职策点；需验证生成流程时移除本标记"
    fill:
      description: "一种基于物联网的智能恒温控制系统，通过温度传感器实时采集环境温度，结合模糊控制算法动态调节加热功率，实现±0.5℃的控温精度。应用领域：智能家居温控。关键指标：控温精度±0.5℃、响应时间<1s。"

  - name: "查找相似专利"
    url_keyword: "similarPatents"
    submit_button: "生成查找专利结果"
    result_hint: "专利申请号"
    skip_reason: "已验证通过，避免重复消耗职策点；需验证生成流程时移除本标记"
    fill:
      description: "一种基于物联网的智能恒温控制系统，通过温度传感器实时采集环境温度，结合模糊控制算法动态调节加热功率，实现±0.5℃的控温精度。应用领域：智能家居温控。关键指标：控温精度±0.5℃、响应时间<1s。"

  # ==================== 人力资源（第三类） ====================
  # 以下 6 个工具的路由与表单结构已于真站实测校准（2026-08-20 探查）。

  - name: "工作经历生成"
    url_keyword: "personalAll/personal"
    title_mark: "个人信息"
    no_submit_validation: true
    skip_reason: "该功能为个人信息页（非 AI 生成向导），入口/导航与成长规划由专用用例覆盖，不参与生成"
    fill: {}

  - name: "简历定向生成"
    url_keyword: "jianli"
    submit_button: "开始生成简历"
    result_hint: "生成简历"
    skip_reason: "表单已实测（目标岗位+候选人材料）；完整生成消耗职策点且结果未验证，需验证时移除本标记"
    fill:
      description: "资深算法工程师。要求：Python、机器学习、推荐系统、工程落地。本人具备 5 年推荐系统研发经验，主导过个性化召回与排序优化，熟悉深度模型在线服务化。"
      work_position: "资深算法工程师"

  - name: "简历优化"
    url_keyword: "resumeOptimize"
    title_mark: "模块导航"
    no_submit_validation: true
    skip_reason: "编辑器类页面（模块导航+AI助手），表单交互复杂且生成结果未验证，待实测后补生成用例"
    fill: {}

  - name: "论文查重"
    url_keyword: "paperStudio"
    title_mark: "论文优化工作台"
    no_submit_validation: true
    skip_reason: "论文工作台（模式切换+正文输入+结果面板），运行任务按钮待实测确认；结果未验证"
    fill: {}

  - name: "材料审查"
    url_keyword: "materialReview"
    submit_button: "开始审查"
    result_hint: "缺失佐证"
    skip_reason: "开始审查依赖个人信息+申报档案+知识库材料，空数据行为待实测；结果未验证"
    fill: {}

  - name: "研究报告"
    url_keyword: "researchReport"
    submit_button: "生成研究报告"
    result_hint: "生成研究报告"
    skip_reason: "研究主题必填（0/25 字）且可带参考文件，完整生成消耗职策点且结果未验证；需验证时移除本标记"
    fill:
      description: "企业人才培养体系建设研究"
