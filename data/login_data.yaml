# 登录功能 —— 数据驱动用例数据
#
# 安全说明：手机号与真实密码不写入本文件（避免凭据入库），
# 由 tests/test_login.py 在运行时从环境变量 ACCOUNT（ZCT_PHONE / ZCT_PASSWORD）注入。
# 这里仅保留非敏感数据：登录成功只描述断言；登录失败只保留错误密码 / 空密码标记。

# 登录成功：正确账号密码登录后，弹出"请选择登录身份"弹窗
# （mobile/password 运行时从环境变量注入）
login_success:
  - name: "正确账号密码登录成功"
    expect_title: "请选择登录身份"

# 登录失败（mobile 运行时从环境变量注入）
login_fail:
  - name: "密码错误提示"
    password: "wrongpass1"
    expect_toast: "登录失败，账号密码不正确"

  - name: "密码为空时登录按钮禁用"
    password: ""
    expect_disabled: true
